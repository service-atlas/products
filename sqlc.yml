version: "2"

overrides:
  go:
    overrides:
      - db_type: "timestamp"
        go_type: "github.com/jackc/pgx/v5/pgtype.Timestamptz"
      - db_type: "timestamptz"
        go_type: "github.com/jackc/pgx/v5/pgtype.Timestamptz"
      - db_type: "uuid"
        go_type: "github.com/jackc/pgx/v5/pgtype.UUID"
      - db_type: "text"
        go_type: "github.com/jackc/pgx/v5/pgtype.Text"
      - db_type: "pg_catalog.int4"
        go_type: "int"

sql:
  - engine: "postgresql"
    queries: "internal/platform/platforms.sql"
    schema: "schema.sql"
    gen:
      go:
        out: "internal/platform/db"
        sql_package: "pgx/v5"
        output_models_file_name: "models.gen.go"
        output_db_file_name: "db.gen.go"
        output_files_suffix: ".gen.go"
        output_querier_file_name: "querier.gen.go"
        emit_interface: true
        emit_json_tags: true
        omit_unused_structs: true

  - engine: "postgresql"
    queries: "internal/product/products.sql"
    schema: "schema.sql"
    gen:
      go:
        out: "internal/product/db"
        sql_package: "pgx/v5"
        output_models_file_name: "models.gen.go"
        output_db_file_name: "db.gen.go"
        output_files_suffix: ".gen.go"
        output_querier_file_name: "querier.gen.go"
        emit_interface: true
        emit_json_tags: true
        omit_unused_structs: true

  - engine: "postgresql"
    queries: "internal/flow/flows.sql"
    schema: "schema.sql"
    gen:
      go:
        out: "internal/flow/db"
        sql_package: "pgx/v5"
        output_models_file_name: "models.gen.go"
        output_db_file_name: "db.gen.go"
        output_files_suffix: ".gen.go"
        output_querier_file_name: "querier.gen.go"
        emit_interface: true
        emit_json_tags: true
        omit_unused_structs: true