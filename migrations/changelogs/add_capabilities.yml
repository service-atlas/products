databaseChangeLog:
  - changeSet:
      id: create-capabilities-table
      author: junie
      changes:
        - createTable:
            tableName: capabilities
            columns:
              - column:
                  name: id
                  type: int
                  autoIncrement: true
                  startWith: 1
                  constraints:
                    primaryKey: true
              - column:
                  name: product_id
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValue: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMPTZ
                  defaultValue: now()
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseColumnNames: product_id
            baseTableName: capabilities
            constraintName: fk_capabilities_products
            referencedColumnNames: id
            referencedTableName: products
            onDelete: CASCADE
  - changeSet:
      id: create-capability-steps-table
      author: junie
      changes:
        - createTable:
            tableName: capability_steps
            columns:
              - column:
                  name: id
                  type: int
                  autoIncrement: true
                  startWith: 1
                  constraints:
                    primaryKey: true
              - column:
                  name: capability_id
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: flow_step_id
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: protocol
                  type: varchar(255)
              - column:
                  name: target
                  type: TEXT
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValue: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMPTZ
                  defaultValue: now()
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseColumnNames: capability_id
            baseTableName: capability_steps
            constraintName: fk_capability_steps_capabilities
            referencedColumnNames: id
            referencedTableName: capabilities
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseColumnNames: flow_step_id
            baseTableName: capability_steps
            constraintName: fk_capability_steps_flow_steps
            referencedColumnNames: id
            referencedTableName: flow_steps
            onDelete: CASCADE
