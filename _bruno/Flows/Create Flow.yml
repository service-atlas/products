info:
  name: Create Flow
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/products/:id/flows"
  params:
    - name: id
      value: "2"
      type: path
  body:
    type: json
    data: |-
      {
        "name": "Flow 1",
        "description": "flow 1 desc"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: sample
    description: sample successful call to create a product flow
    request:
      url: "{{baseUrl}}/products/:id/flows"
      method: POST
      params:
        - name: id
          value: "2"
          type: path
      body:
        type: json
        data: |-
          {
            "name": "Flow 1",
            "description": "flow 1 desc"
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: content-type
          value: application/json
        - name: vary
          value: Origin, Accept-Encoding
        - name: date
          value: Sat, 16 May 2026 00:11:09 GMT
        - name: content-length
          value: "134"
      body:
        type: json
        data: |-
          {
            "id": 1,
            "product_id": 2,
            "name": "Flow 1",
            "description": "flow 1 desc",
            "created_at": "2026-05-15T19:11:09.35732-05:00",
            "updated_at": "2026-05-15T19:11:09.35732-05:00"
          }

docs: |-
  # Create Flow

  Creates a new flow for a specific product. The product ID is passed as a path parameter.

  ## Possible Status Codes
  | Status Code | Notes |
  | -- | --|
  | 201 | Created |
  | 400 | Invalid product ID or request body |
  | 404 | Product not found |
  | 500 | Internal server error |
