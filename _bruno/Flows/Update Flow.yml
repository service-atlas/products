docs: |-
  # Update Flow

  Updates an existing flow. The flow ID is passed as a path parameter.
  Fields that can be updated:
  - name
  - description

  **Note:** Explicitly providing an empty string for a field (e.g., `"description": ""`) will set that field to `null` in the database. Empty strings are not allowed as valid values for `name`.

  ## Possible Status Codes
  | Status Code | Notes |
  | -- | --|
  | 200 | OK |
  | 400 | Invalid flow ID, request body, or no updatable fields provided |
  | 404 | Flow not found |
  | 500 | Internal server error |
