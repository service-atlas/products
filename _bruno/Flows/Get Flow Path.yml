docs: |
  # Get Flow Path

  Gets a flow path based on the flow id. The id is provided in the path. See sample call for success. 

  ## Possible Responses 
  | Status Code | Notes |
  | -- | --|
  | 200 | Success | 
  | 400 | Invalid Id |
  | 404 | Flow Not Found |
  | 500 | Error | 
