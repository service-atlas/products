info:
  name: Get Capabilities by Flow
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/flows/:id/capabilities"
  params:
    - name: id
      value: "1"
      type: path
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: isArray

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Get Capabilities by Flow Id

  Get a list of capabilities by a flow id

  ## Possible Status Codes
  | Status Code | Notes |
  | -- | --|
  | 200 | Created |
  | 400 | Invalid Id |
  | 404 | Flow not found |
  | 500 | Internal server error |
