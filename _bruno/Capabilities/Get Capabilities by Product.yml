info:
  name: Get Capabilities by Product
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/products/:id/capabilities"
  params:
    - name: id
      value: "1"
      type: path
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: isArray

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

