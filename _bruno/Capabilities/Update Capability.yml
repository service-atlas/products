info:
  name: Update Capability
  type: http
  seq: 5

http:
  method: PUT
  url: "{{baseUrl}}/capabilities/:id"
  params:
    - name: id
      value: "1"
      type: path
  body:
    type: json
    data: |-
      {
      "name": "a test capability",
          "description": "test 2"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: isJson

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: example
    request:
      url: "{{baseUrl}}/capabilities/:id"
      method: PUT
      params:
        - name: id
          value: "1"
          type: path
      body:
        type: json
        data: |-
          {
          "name": "a test capability",
              "description": "test 2"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
        - name: vary
          value: Origin, Accept-Encoding
        - name: date
          value: Sun, 12 Jul 2026 00:49:17 GMT
        - name: content-length
          value: "144"
      body:
        type: json
        data: |-
          {
            "id": 1,
            "product_id": 1,
            "name": "a test capability",
            "description": "test 2",
            "created_at": "2026-07-11T19:47:57.259266-05:00",
            "updated_at": "2026-07-11T19:49:17.27106-05:00"
          }

docs: |-
  # Update Capability

  Update a capability name and/or description

  ## Possible Status Codes
  | Status Code | Notes |
  | -- | --|
  | 200 | Updated |
  | 400 | Invalid id or name |
  | 404 | Capability not found |
  | 500 | Internal server error |
